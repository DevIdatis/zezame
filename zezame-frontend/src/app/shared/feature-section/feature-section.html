<section id="features" class="py-24 relative">
  <div class="container mx-auto px-6">
    <!-- Header -->
    <div class="text-center max-w-2xl mx-auto mb-16">
      <div
        class="inline-flex items-center gap-2 bg-card px-4 py-2 rounded-full border border-border/50 shadow-sm mb-6"
      >
        <lucide-icon [img]="Zap" class="w-4 h-4 text-yellow"></lucide-icon>
        <span class="text-sm font-medium text-muted-foreground"> Funcionalidades potentes </span>
      </div>

      <h2 class="text-4xl md:text-5xl font-bold font-display mb-4">
        Todo lo que necesitas,<br />
        <span class="gradient-text">nada que sobre</span>
      </h2>

      <p class="text-lg text-muted-foreground">
        Herramientas diseñadas para hacerte la vida más fácil y tu trabajo más divertido.
      </p>
    </div>

    <!-- Features Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (feature of features; track feature.title) {
        <div
          class="group card-glass rounded-2xl p-6 hover:scale-105 transition-all duration-300 cursor-pointer"
        >
          <div
            class="w-14 h-14 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform"
            [class]="feature.bgColor"
          >
            <lucide-icon [img]="feature.icon" class="w-7 h-7" [class]="feature.color"></lucide-icon>
          </div>

          <h3 class="text-xl font-semibold font-display mb-2">
            {{ feature.title }}
          </h3>

          <p class="text-muted-foreground">
            {{ feature.description }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
