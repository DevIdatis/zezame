<section class="py-20 relative overflow-hidden">
  <!-- Background -->
  <div class="absolute inset-0 gradient-bg opacity-5"></div>

  <div class="container mx-auto px-6 relative z-10">
    <div class="card-glass rounded-3xl p-8 md:p-12">
      <div class="flex items-center justify-center gap-2 mb-8">
        <lucide-icon [img]="TrendingUp" class="w-5 h-5 text-secondary"></lucide-icon>
        <span class="text-muted-foreground font-medium">Números que hablan</span>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-8">
        @for (stat of stats; track stat.label) {
          <div class="text-center group">
            <div class="text-4xl mb-2 group-hover:scale-125 transition-transform">
              {{ stat.emoji }}
            </div>
            <div class="text-4xl md:text-5xl font-bold font-display gradient-text mb-2">
              {{ stat.value }}
            </div>
            <div class="text-muted-foreground">{{ stat.label }}</div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
