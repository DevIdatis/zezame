<div class="absolute inset-0 overflow-hidden pointer-events-none">
  <!-- Animated Blobs -->
  <div class="blob w-96 h-96 bg-coral -top-48 -left-48"></div>
  <div class="blob w-80 h-80 bg-cyan top-1/4 -right-40 animation-delay-200"></div>
  <div class="blob w-72 h-72 bg-yellow bottom-20 left-1/4 animation-delay-400"></div>
  <div class="blob w-64 h-64 bg-purple -bottom-32 right-1/3 animation-delay-600"></div>

  <!-- Floating Icons -->
  <div class="absolute top-20 left-[15%] float">
    <div class="bg-card p-4 rounded-2xl shadow-lg border border-border/50">
      <lucide-icon [img]="Clock" class="w-8 h-8 text-primary"></lucide-icon>
    </div>
  </div>

  <div class="absolute top-40 right-[20%] float-delay">
    <div class="bg-card p-4 rounded-2xl shadow-lg border border-border/50">
      <lucide-icon [img]="Zap" class="w-8 h-8 text-yellow"></lucide-icon>
    </div>
  </div>

  <div class="absolute bottom-40 left-[10%] float-delay-2">
    <div class="bg-card p-4 rounded-2xl shadow-lg border border-border/50">
      <lucide-icon [img]="Star" class="w-8 h-8 text-secondary"></lucide-icon>
    </div>
  </div>

  <div class="absolute top-1/3 left-[8%] float-delay">
    <div class="bg-card p-3 rounded-xl shadow-lg border border-border/50">
      <lucide-icon [img]="Heart" class="w-6 h-6 text-coral"></lucide-icon>
    </div>
  </div>

  <div class="absolute bottom-60 right-[12%] float">
    <div class="bg-card p-3 rounded-xl shadow-lg border border-border/50">
      <lucide-icon [img]="Sparkles" class="w-6 h-6 text-purple"></lucide-icon>
    </div>
  </div>
</div>
