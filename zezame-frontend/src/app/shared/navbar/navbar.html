<!-- navbar.component.html -->
<nav
  class="fixed top-0 left-0 right-0 z-50 bg-background/80 backdrop-blur-xl border-b border-border/50"
>
  <div class="container mx-auto px-6 py-4">
    <div class="flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div class="gradient-bg p-2 rounded-xl">
          <lucide-icon [img]="Clock" class="w-6 h-6 text-primary-foreground"></lucide-icon>
        </div>
        <span class="text-2xl font-bold font-display gradient-text">Zezame</span>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center gap-8">
        <a
          href="#features"
          class="text-muted-foreground hover:text-foreground transition-colors font-medium"
        >
          Características
        </a>
        <a
          href="#how-it-works"
          class="text-muted-foreground hover:text-foreground transition-colors font-medium"
        >
          Cómo funciona
        </a>
        <a
          href="#pricing"
          class="text-muted-foreground hover:text-foreground transition-colors font-medium"
        >
          Precios
        </a>
      </div>

      <!-- CTA Buttons -->
      <div class="hidden md:flex items-center gap-4">
        <button class="btn-secondary" (click)="openLogin()">Iniciar sesión</button>
        <button class="btn-primary" (click)="openSignUp()">Empezar gratis</button>
      </div>

      <!-- Mobile Menu Button -->
      <button class="md:hidden p-2 rounded-xl bg-muted" (click)="isOpen = !isOpen">
        <lucide-icon [img]="Menu" class="w-6 h-6"></lucide-icon>
      </button>
    </div>

    <!-- Mobile Menu -->
    @if (isOpen) {
      <div class="md:hidden mt-4 py-4 border-t border-border animate-slide-up">
        <div class="flex flex-col gap-4">
          <a
            href="#features"
            class="text-muted-foreground hover:text-foreground transition-colors font-medium py-2"
          >
            Características
          </a>
          <a
            href="#how-it-works"
            class="text-muted-foreground hover:text-foreground transition-colors font-medium py-2"
          >
            Cómo funciona
          </a>
          <a
            href="#pricing"
            class="text-muted-foreground hover:text-foreground transition-colors font-medium py-2"
          >
            Precios
          </a>
          <div class="flex flex-col gap-3 pt-4">
            <button class="btn-secondary w-full" (click)="openLogin()">Iniciar sesión</button>
            <button class="btn-primary w-full" (click)="openSignUp()">Empezar gratis</button>
          </div>
        </div>
      </div>
    }
  </div>
</nav>

<app-login-register
  [isOpen]="showLogin"
  [isSignUp]="signUp"
  (close)="showLogin = false"
  (login)="handleLogin()"
>
</app-login-register>
