<section class="py-24 relative">
  <div class="container mx-auto px-6">
    <!-- Section Header -->
    <div class="text-center max-w-2xl mx-auto mb-16">
      <div
        class="inline-flex items-center gap-2 bg-card px-4 py-2 rounded-full border border-border/50 shadow-sm mb-6"
      >
        <lucide-icon [img]="Star" class="w-4 h-4 text-yellow fill-yellow"></lucide-icon>
        <span class="text-sm font-medium text-muted-foreground"> Amado por miles </span>
      </div>
      <h2 class="text-4xl md:text-5xl font-bold font-display mb-4">
        Lo que dicen<br />
        <span class="gradient-text">nuestros fans</span>
      </h2>
    </div>

    <!-- Testimonials Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      @for (testimonial of testimonials; track testimonial.name) {
        <div class="card-glass rounded-2xl p-6 hover:scale-105 transition-all duration-300">
          <lucide-icon [img]="Quote" class="w-8 h-8 text-muted-foreground/30 mb-4"></lucide-icon>

          <p class="text-lg mb-6">{{ testimonial.content }}</p>

          <div class="flex items-center gap-2 mb-4">
            @for (star of stars(testimonial.rating); track $index) {
              <lucide-icon [img]="Star" class="w-4 h-4 text-yellow fill-yellow"></lucide-icon>
            }
          </div>

          <div class="flex items-center gap-3">
            <div
              class="w-12 h-12 rounded-full flex items-center justify-center text-primary-foreground font-bold"
              [class]="testimonial.color"
            >
              {{ testimonial.avatar }}
            </div>
            <div>
              <div class="font-semibold font-display">{{ testimonial.name }}</div>
              <div class="text-sm text-muted-foreground">{{ testimonial.role }}</div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
