@if (open) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4"
    (click)="close()"
  >
    <div
      class="relative w-full max-w-md bg-card border border-border/50 rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] scroll-area"
      (click)="$event.stopPropagation()"
    >
      <div class="absolute inset-x-0 top-0 h-1.5 bg-gradient-to-r from-cyan to-lime"></div>

      <button
        type="button"
        class="absolute top-4 right-4 z-10 text-muted-foreground hover:text-foreground transition-colors"
        (click)="close()"
      >
        <lucide-icon [img]="X" class="w-5 h-5"></lucide-icon>
      </button>

      <div class="p-7">
        <div class="flex items-center gap-3 mb-5">
          <div
            class="w-11 h-11 rounded-2xl bg-gradient-to-br from-cyan to-lime flex items-center justify-center shadow-lg shadow-cyan/30"
          >
            <lucide-icon [img]="Clock" class="w-5 h-5 text-white"></lucide-icon>
          </div>
          <div>
            <h2 class="text-xl font-display font-semibold">Añadir entrada</h2>
            <p class="text-sm text-muted-foreground">Registra tiempo de trabajo manualmente</p>
          </div>
        </div>

        <div class="space-y-4">
          <div class="space-y-1.5">
            <label class="text-sm font-medium">Fecha</label>
            <input
              type="date"
              [value]="dateStr()"
              (input)="dateStr.set($any($event.target).value)"
              class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan/50"
            />
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-1.5">
              <label class="text-sm font-medium">Inicio</label>
              <input
                type="time"
                [value]="start()"
                (input)="start.set($any($event.target).value)"
                class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan/50"
              />
            </div>
            <div class="space-y-1.5">
              <label class="text-sm font-medium">Fin</label>
              <input
                type="time"
                [value]="end()"
                (input)="end.set($any($event.target).value)"
                class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan/50"
              />
            </div>
          </div>

          <div class="space-y-1.5">
            <label class="text-sm font-medium">Proyecto</label>
            <select
              [value]="projectId()"
              (change)="projectId.set($any($event.target).value)"
              class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan/50"
            >
              <option value="">Sin proyecto</option>
              @for (p of projects(); track p.id) {
                <option [value]="p.id">{{ p.name }}</option>
              }
            </select>
          </div>

          <div class="space-y-1.5">
            <label class="text-sm font-medium">Descripción</label>
            <input
              type="text"
              placeholder="¿En qué trabajaste? (opcional)"
              [value]="description()"
              (input)="description.set($any($event.target).value)"
              class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan/50"
            />
          </div>

          @if (error()) {
            <p class="text-sm text-red-500">{{ error() }}</p>
          }
        </div>

        <div class="flex justify-end gap-2 mt-6 pt-4 border-t border-border/50">
          <button
            type="button"
            (click)="close()"
            class="px-4 py-2 rounded-lg font-semibold bg-card text-foreground border-2 border-border hover:border-primary transition-all"
          >
            Cancelar
          </button>
          <button
            type="button"
            (click)="submit()"
            [disabled]="saving()"
            class="px-4 py-2 rounded-lg font-semibold bg-gradient-to-r from-cyan to-lime hover:opacity-90 text-white shadow-lg shadow-cyan/30 transition-all disabled:opacity-50"
          >
            {{ saving() ? 'Guardando...' : 'Añadir entrada' }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
